[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shield-modular"
version = "0.1.0"
description = "Modular research framework for SHIELD hardware-Trojan test generation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
legacy = ["numpy>=1.24", "networkx>=3.0", "matplotlib>=3.7"]
test = ["pytest>=8.0"]

[project.scripts]
shield-run = "shield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

